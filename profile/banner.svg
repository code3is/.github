<svg width="1280" height="340" viewBox="0 0 1280 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Code3 Innovative Solutions</title>
  <desc id="d">We turn business problems into fast, reliable software.</desc>
  <defs>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1080 40) rotate(120) scale(420 520)">
      <stop stop-color="#22D3EE" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(140 340) rotate(-30) scale(520 380)">
      <stop stop-color="#3B82F6" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#60A5FA" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#94A3B8" fill-opacity="0.18"/>
    </pattern>
    <clipPath id="round"><rect width="1280" height="340" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1280" height="340" fill="#0B1020"/>
    <rect width="1280" height="340" fill="url(#dots)"/>
    <rect width="1280" height="340" fill="url(#glowA)"/>
    <rect width="1280" height="340" fill="url(#glowB)"/>
    <rect x="0" y="339" width="1280" height="1" fill="url(#line)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="339" rx="19.5" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- Logo mark -->
  <rect x="80" y="82" width="64" height="64" rx="16" fill="url(#mark)"/>
  <text x="112" y="125" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" font-weight="700" fill="#0B1020">C3</text>
  <text x="164" y="122" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="3" fill="#94A3B8">CODE3 INNOVATIVE SOLUTIONS</text>

  <!-- Headline -->
  <text font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="50" font-weight="700" fill="#F8FAFC" letter-spacing="-1">
    <tspan x="80" y="206">Fast, reliable software</tspan>
    <tspan x="80" y="264" fill="#67E8F9">for businesses that grow.</tspan>
  </text>

  <!-- Pills -->
  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#CBD5E1">
    <rect x="80" y="288" width="104" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="132" y="308" text-anchor="middle">Web apps</text>
    <rect x="196" y="288" width="132" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="262" y="308" text-anchor="middle">Custom software</text>
    <rect x="340" y="288" width="98" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="389" y="308" text-anchor="middle">APIs</text>
    <rect x="450" y="288" width="86" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="493" y="308" text-anchor="middle">CMS</text>
    <rect x="548" y="288" width="118" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="607" y="308" text-anchor="middle">Performance</text>
  </g>

  <!-- Decorative code window -->
  <g transform="translate(880 70)">
    <rect width="320" height="200" rx="14" fill="#0F172A" fill-opacity="0.85" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <circle cx="22" cy="22" r="5" fill="#F87171"/>
    <circle cx="40" cy="22" r="5" fill="#FBBF24"/>
    <circle cx="58" cy="22" r="5" fill="#4ADE80"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
      <text x="24" y="62" fill="#64748B">// ship it</text>
      <text x="24" y="88"><tspan fill="#C084FC">const</tspan><tspan fill="#E2E8F0"> c3is = </tspan><tspan fill="#67E8F9">{</tspan></text>
      <text x="44" y="112"><tspan fill="#93C5FD">fast</tspan><tspan fill="#E2E8F0">: </tspan><tspan fill="#86EFAC">true</tspan><tspan fill="#E2E8F0">,</tspan></text>
      <text x="44" y="136"><tspan fill="#93C5FD">scalable</tspan><tspan fill="#E2E8F0">: </tspan><tspan fill="#86EFAC">true</tspan><tspan fill="#E2E8F0">,</tspan></text>
      <text x="44" y="160"><tspan fill="#93C5FD">accessible</tspan><tspan fill="#E2E8F0">: </tspan><tspan fill="#86EFAC">true</tspan><tspan fill="#E2E8F0">,</tspan></text>
      <text x="24" y="184" fill="#67E8F9">}</text>
    </g>
  </g>
</svg>
